# Catalog of known AI-agent prompt-file locations (where `tj summarize` looks).
# Curated data — PRs welcome, like tokenjam/pricing/models.toml. Anil decides what ships.
# Per tool:
#   project_files = bare filenames checked at the scan root (and matched while --recursive walks)
#   project_globs = root-relative globs for "obvious" prompt folders (shallow, no deep walk)
#   global_paths  = user/system locations loaded regardless of project ("~" is expanded)
# Users can extend/override locally at ~/.config/tj/agent_files.toml (merged over this).

[claude]                 # Claude Code
project_files = ["CLAUDE.md", "CLAUDE.local.md"]   # .local = historical local override
project_globs = [
    # Rules are matched RECURSIVELY: real rule trees nest (`rules/ecc/common/*.md`)
    # and a single-level `rules/*.md` silently prices none of them. The
    # single-level pattern is kept alongside so a path that only ever matched it
    # keeps matching (`Path.match` handles it without `**` semantics).
    ".claude/rules/*.md",
    ".claude/rules/**/*.md",
    ".claude/skills/*/SKILL.md",
    ".claude/commands/*.md",
    ".claude/agents/*.md",
]
global_paths = [
    "~/.claude/CLAUDE.md", "/etc/claude-code/CLAUDE.md",
    # `~/.claude/rules/**` was missing here while the project-side equivalent was
    # listed, so a user's global rule tree — always-resident text, re-sent at the
    # head of every session — was scanned on no scope at all.
    "~/.claude/rules/**/*.md",
    "~/.claude/agents/*.md", "~/.claude/skills/*/SKILL.md", "~/.claude/commands/*.md",
]
# DELIBERATELY ABSENT: ~/.claude/plugins/**. It looks like the obvious next entry —
# thousands of SKILL.md files structurally identical to ~/.claude/skills/*/SKILL.md,
# sitting right beside it — and adding it would fabricate a large number. Whether a
# plugin's surface ever reaches the model is decided by two gates that leave no trace
# on disk: `enabledPlugins` in ~/.claude/settings.json (a disabled plugin contributes
# nothing) and install SCOPE (a project-scoped plugin loads only for that project).
# Observed on a live session: 15 of 814 plugin SKILL.md files were resident; a naive
# entry would have priced all 814. Existing on disk is not evidence of being loaded.
# Plugin files are also third-party, under plugins/cache/<marketplace>/<plugin>/<version>/,
# so a rewrite is reverted by the next plugin update — a fix that appears to succeed
# and then silently regresses. If plugins are ever priced, it belongs in an analyzer
# that reads the enablement + scope gates, not in this catalog.

[gemini]                 # Gemini CLI
project_files = ["GEMINI.md"]
project_globs = []
global_paths = ["~/.gemini/GEMINI.md"]

[codex]                  # Codex CLI (AGENTS.md = cross-tool universal standard)
project_files = ["AGENTS.md", "codex.md"]                          # codex.md = historical
project_globs = []
global_paths = ["~/.codex/AGENTS.md", "~/.codex/instructions.md"]  # instructions.md = historical

[safety]
# Extra dirs (depth >= 2) to never treat as a repo root. The core gates — filesystem
# root, the user's home, and any bare top-level dir — live in code and cannot be
# disabled here; this list only ADDS boundaries.
forbidden_roots = []
